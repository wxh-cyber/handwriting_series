<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI 大模型 SSE 演示</title>
    <style>
      :root {
        color-scheme: light;
        font-family: "Trebuchet MS", "Microsoft YaHei", sans-serif;
        --page-bg: #eef2f9;
        --panel-bg: rgba(255, 255, 255, 0.92);
        --border-color: rgba(107, 122, 153, 0.18);
        --text-main: #172033;
        --text-subtle: #5e6b85;
        --sidebar-bg: #111827;
        --sidebar-text: #e5eefc;
        --sidebar-subtle: #8fa3c6;
        --accent: #2563eb;
        --accent-soft: rgba(37, 99, 235, 0.12);
        --assistant-bg: #ffffff;
        --user-bg: #2563eb;
        --user-text: #f8fbff;
        --error: #c2410c;
        --shadow: 0 24px 60px rgba(15, 23, 42, 0.10);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background:
          radial-gradient(circle at top left, rgba(37, 99, 235, 0.16), transparent 34%),
          radial-gradient(circle at bottom right, rgba(148, 163, 184, 0.18), transparent 28%),
          var(--page-bg);
        color: var(--text-main);
      }

      main {
        width: min(1280px, calc(100vw - 40px));
        height: min(900px, calc(100vh - 40px));
        margin: 20px auto;
      }

      .chat-layout {
        display: grid;
        grid-template-columns: 304px minmax(0, 1fr);
        gap: 0;
        height: 100%;
        border: 1px solid rgba(148, 163, 184, 0.22);
        border-radius: 28px;
        overflow: hidden;
        background: rgba(255, 255, 255, 0.72);
        backdrop-filter: blur(18px);
        box-shadow: var(--shadow);
      }

      .sidebar {
        display: flex;
        flex-direction: column;
        min-width: 0;
        background:
          linear-gradient(180deg, rgba(15, 23, 42, 0.98), rgba(17, 24, 39, 0.96)),
          var(--sidebar-bg);
        color: var(--sidebar-text);
        transition: width 0.24s ease, padding 0.24s ease;
        width: 304px;
        padding: 20px 16px 16px;
      }

      .sidebar.collapsed {
        width: 84px;
        padding-inline: 12px;
      }

      .sidebar-header {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 18px;
      }

      .sidebar-brand {
        min-width: 0;
      }

      .sidebar-brand h1 {
        margin: 0;
        font-size: 22px;
        line-height: 1.1;
        color: var(--sidebar-text);
      }

      .sidebar-brand p {
        margin: 8px 0 0;
        color: var(--sidebar-subtle);
        font-size: 13px;
      }

      .sidebar.collapsed .sidebar-brand p,
      .sidebar.collapsed .sidebar-brand h1,
      .sidebar.collapsed .session-content,
      .sidebar.collapsed .new-session-label {
        display: none;
      }

      .sidebar-toggle,
      .sidebar-toggle-compact {
        border: 1px solid rgba(148, 163, 184, 0.18);
        background: rgba(255, 255, 255, 0.08);
        color: inherit;
        padding: 9px 12px;
      }

      .sidebar-toggle-compact {
        display: none;
      }

      .new-session-button {
        width: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        margin-bottom: 16px;
        background: rgba(37, 99, 235, 0.9);
        color: #f8fbff;
      }

      .sidebar.collapsed .new-session-button {
        padding-inline: 0;
      }

      .session-list {
        flex: 1;
        min-height: 0;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        gap: 10px;
        padding-right: 2px;
      }

      .session-item {
        width: 100%;
        border: 1px solid transparent;
        border-radius: 18px;
        background: rgba(255, 255, 255, 0.06);
        color: inherit;
        text-align: left;
        padding: 12px;
        display: flex;
        align-items: flex-start;
        gap: 12px;
        transition: background 0.2s ease, border-color 0.2s ease, transform 0.2s ease;
      }

      .session-item:hover:not(:disabled) {
        transform: translateY(-1px);
        background: rgba(255, 255, 255, 0.10);
        border-color: rgba(191, 219, 254, 0.22);
      }

      .session-item.active {
        background: rgba(37, 99, 235, 0.18);
        border-color: rgba(96, 165, 250, 0.34);
      }

      .session-item:disabled {
        cursor: not-allowed;
        opacity: 0.72;
      }

      .session-avatar {
        width: 40px;
        height: 40px;
        border-radius: 14px;
        background: rgba(255, 255, 255, 0.12);
        color: #dbe8ff;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 14px;
        font-weight: 700;
        flex-shrink: 0;
      }

      .session-content {
        min-width: 0;
      }

      .session-title {
        margin: 0;
        font-size: 14px;
        font-weight: 700;
        color: #f8fbff;
      }

      .session-preview,
      .session-time {
        margin: 4px 0 0;
        font-size: 12px;
        color: var(--sidebar-subtle);
        line-height: 1.5;
      }

      .chat-shell {
        display: grid;
        grid-template-rows: auto minmax(0, 1fr) auto;
        min-width: 0;
        background: linear-gradient(180deg, rgba(255, 255, 255, 0.62), rgba(255, 255, 255, 0.92));
      }

      .chat-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        padding: 22px 28px 18px;
        border-bottom: 1px solid var(--border-color);
      }

      .chat-header-copy {
        min-width: 0;
      }

      .chat-header h2 {
        margin: 0;
        font-size: 24px;
      }

      .chat-header p {
        margin: 8px 0 0;
        color: var(--text-subtle);
        font-size: 13px;
      }

      .status-chip {
        flex-shrink: 0;
        padding: 10px 14px;
        border-radius: 999px;
        background: rgba(15, 23, 42, 0.06);
        color: var(--text-subtle);
        font-size: 13px;
      }

      #output {
        overflow-y: auto;
        padding: 28px;
        display: flex;
        flex-direction: column;
        gap: 18px;
      }

      .empty-state {
        margin: auto;
        width: min(420px, 100%);
        padding: 30px 28px;
        border: 1px dashed rgba(100, 116, 139, 0.24);
        border-radius: 24px;
        background: rgba(255, 255, 255, 0.62);
        text-align: center;
      }

      .empty-state h3 {
        margin: 0;
        font-size: 20px;
      }

      .empty-state p {
        margin: 10px 0 0;
        color: var(--text-subtle);
        line-height: 1.7;
      }

      .message-row {
        display: flex;
      }

      .message-row.user {
        justify-content: flex-end;
      }

      .message-row.assistant {
        justify-content: flex-start;
      }

      .message-bubble {
        width: min(78%, 760px);
        border-radius: 22px;
        padding: 16px 18px;
        border: 1px solid var(--border-color);
        background: var(--assistant-bg);
        box-shadow: 0 12px 34px rgba(148, 163, 184, 0.14);
      }

      .message-row.user .message-bubble {
        background: linear-gradient(180deg, rgba(37, 99, 235, 0.96), rgba(29, 78, 216, 0.94));
        color: var(--user-text);
        border-color: rgba(59, 130, 246, 0.28);
      }

      .message-meta {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 8px;
        font-size: 12px;
        color: var(--text-subtle);
      }

      .message-row.user .message-meta {
        color: rgba(239, 246, 255, 0.84);
      }

      .message-role {
        font-weight: 700;
      }

      .message-status.error {
        color: var(--error);
      }

      .message-content {
        margin: 0;
        white-space: pre-wrap;
        word-break: break-word;
        line-height: 1.8;
        font-size: 15px;
      }

      .composer {
        padding: 18px 28px 24px;
        border-top: 1px solid var(--border-color);
        background: rgba(255, 255, 255, 0.78);
      }

      .composer-frame {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 16px;
        align-items: end;
        padding: 16px;
        border-radius: 24px;
        background: rgba(255, 255, 255, 0.92);
        border: 1px solid rgba(148, 163, 184, 0.24);
        box-shadow: 0 18px 30px rgba(148, 163, 184, 0.10);
      }

      textarea {
        width: 100%;
        min-height: 96px;
        resize: vertical;
        border: 1px solid rgba(148, 163, 184, 0.22);
        border-radius: 18px;
        padding: 14px 16px;
        font: inherit;
        line-height: 1.6;
        background: rgba(248, 250, 252, 0.96);
        color: var(--text-main);
      }

      textarea:disabled {
        background: rgba(226, 232, 240, 0.55);
        cursor: not-allowed;
      }

      button {
        border: 0;
        border-radius: 16px;
        background: var(--accent);
        color: #fff;
        padding: 11px 18px;
        font: inherit;
        font-weight: 700;
        cursor: pointer;
        transition: transform 0.2s ease, opacity 0.2s ease, background 0.2s ease;
      }

      button:hover:not(:disabled) {
        transform: translateY(-1px);
      }

      button:disabled {
        cursor: not-allowed;
        opacity: 0.56;
      }

      .composer-actions {
        display: flex;
        flex-direction: column;
        justify-content: flex-end;
        gap: 8px;
      }

      .composer-tip {
        font-size: 12px;
        color: var(--text-subtle);
        text-align: right;
      }

      @media (max-width: 960px) {
        main {
          width: 100vw;
          height: 100vh;
          margin: 0;
        }

        .chat-layout {
          border-radius: 0;
          grid-template-columns: 1fr;
        }

        .sidebar {
          position: absolute;
          inset: 0 auto 0 0;
          z-index: 2;
          height: 100%;
          box-shadow: 14px 0 36px rgba(15, 23, 42, 0.22);
        }

        .sidebar.collapsed {
          transform: translateX(-100%);
          width: 304px;
          padding-inline: 16px;
        }

        .sidebar.collapsed .sidebar-brand p,
        .sidebar.collapsed .sidebar-brand h1,
        .sidebar.collapsed .session-content,
        .sidebar.collapsed .new-session-label {
          display: block;
        }

        .sidebar-toggle-compact {
          display: inline-flex;
        }

        .message-bubble {
          width: 100%;
        }

        .composer-frame {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <main class="chat-layout">
      <!-- 会话列表侧边栏 -->
      <aside id="sidebar" class="sidebar">
        <div class="sidebar-header">
          <div class="sidebar-brand">
            <h1>会话列表</h1>
            <p>多会话上下文会自动保存在本地服务端文件中。</p>
          </div>
          <button id="sidebarToggle" class="sidebar-toggle" type="button">收起</button>
        </div>

        <button id="newSessionButton" class="new-session-button" type="button">
          <span>+</span>
          <span class="new-session-label">新建会话</span>
        </button>

        <div id="sessionList" class="session-list"></div>
      </aside>

      <section class="chat-shell">
        <header class="chat-header">
          <div class="chat-header-copy">
            <button id="sidebarToggleCompact" class="sidebar-toggle-compact" type="button">会话</button>
            <h2 id="sessionTitle">请选择一个会话</h2>
            <p id="sessionMeta">左侧可创建或切换不同会话，当前系统会保留上下文。</p>
          </div>
          <span id="status" class="status-chip">等待输入</span>
        </header>

        <!-- 流式输出结果 -->
        <div id="output"></div>

        <footer class="composer">
          <div class="composer-frame">
            <!-- 提示词输入框 -->
            <textarea id="prompt" placeholder="输入你的问题，当前会话会自动携带之前的上下文。"></textarea>

            <div class="composer-actions">
              <!-- 发送按钮 -->
              <button id="sendButton" type="button">发送</button>
              <span class="composer-tip">Shift + Enter 换行</span>
            </div>
          </div>
        </footer>
      </section>
    </main>

    <script src="/sse-parser.js"></script>
    <script src="/app.js"></script>
  </body>
  </html>
