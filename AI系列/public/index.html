<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI 大模型 SSE 演示</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Arial, "Microsoft YaHei", sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: #f5f7fb;
        color: #1f2937;
      }

      main {
        max-width: 840px;
        margin: 40px auto;
        padding: 0 20px;
      }

      .panel {
        background: #ffffff;
        border: 1px solid #d7deea;
        border-radius: 8px;
        padding: 24px;
      }

      h1 {
        margin: 0 0 8px;
        font-size: 28px;
      }

      p {
        margin: 0 0 20px;
        color: #52607a;
      }

      textarea {
        width: 100%;
        min-height: 120px;
        resize: vertical;
        border: 1px solid #c6d0e1;
        border-radius: 8px;
        padding: 12px 14px;
        font: inherit;
        line-height: 1.6;
        background: #fff;
      }

      .toolbar {
        display: flex;
        gap: 12px;
        align-items: center;
        margin: 16px 0;
      }

      button {
        border: 0;
        border-radius: 8px;
        background: #2563eb;
        color: #fff;
        padding: 10px 18px;
        font: inherit;
        cursor: pointer;
      }

      button:disabled {
        cursor: not-allowed;
        background: #93a8d8;
      }

      #status {
        color: #52607a;
        font-size: 14px;
      }

      pre {
        min-height: 220px;
        margin: 0;
        padding: 16px;
        border-radius: 8px;
        background: #111827;
        color: #e5eefc;
        line-height: 1.7;
        white-space: pre-wrap;
        word-break: break-word;
      }
    </style>
  </head>
  <body>
    <main>
      <section class="panel">
        <h1>AI 大模型 SSE 演示</h1>
        <p>输入一句话，浏览器会实时显示后端转发的大模型流式输出。</p>

        <!-- 提示词输入框 -->
        <textarea id="prompt" placeholder="例如：请用通俗中文解释一下什么是 SSE？"></textarea>

        <div class="toolbar">
          <!-- 发送按钮 -->
          <button id="sendButton" type="button">发送</button>
          <span id="status">等待输入</span>
        </div>

        <!-- 流式输出结果 -->
        <pre id="output">这里会显示流式输出结果...</pre>
      </section>
    </main>

    <script src="/app.js"></script>
  </body>
  </html>
