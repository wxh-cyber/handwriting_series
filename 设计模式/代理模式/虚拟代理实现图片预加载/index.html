<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>虚拟代理实现图片预加载</title>
</head>
<body>
    <script type="text/javascript">
        var myImage=(function(){
            var imgNode=document.createElement('img');
            document.body.appendChild(imgNode);

            return {
                setSrc:function(src){
                    imgNode.src=src;
                }
            }
        })();

        var proxyImage=(function(){
            var img=new Image();
            img.onload=function(){
                myImage.setSrc(this.src);
            }

            return {
                setSrc:function(src){
                    myImage.setSrc('file:///C:/Users/Administrator/Desktop/loading.gif');  //先显示loading图片
                    img.src=src;  //在后台加载真正的图片
                }
            }
        })();

        proxyImage.setSrc('file:///C:/Users/Administrator/Desktop/real_image.jpg');  //当真正的图片加载成功后，替换掉loading图片
    
    </script>
</body>
</html>
