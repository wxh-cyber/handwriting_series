<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>固定导航栏滚动</title>
    <style>
        :root {
            --nav-height:64px;
            --bg:#0c0f14;
            --bg-elevated:#141820;
            --fg:#e8eaf0;
            --fg-muted:#7a8299;
            --accent:#00e08e;
            --accent-dim:rgba(0,224,142,0.12);
            --card:#181d28;
            --border:rgba(255,255,255,0.06);
            --radius:14px;
            --font:'Noto Sans SC', sans-serif;
        }


        /* 基础重置 */
        *,*::before,*::after {
            margin:0;
            padding:0;
            box-sizing: border-box;
        }

        html {
            /* 滚动时使用平滑过渡动画 */
            scroll-behavior: smooth;
        }

        body {
            font-family: var(--font);
            background: var(--bg);
            color: var(--fg);
            line-height: 1.7;
            overflow-x:hidden;
        }

        a {
            text-decoration: none;
            color: inherit;
        }

        ul {
            list-style: none;
        }

        /* ========================================  
            核心原理：
            1.导航栏 position:fixed 脱离文档流，固定在视口顶部
            2.主内容区padding-top:var(--nav-height) 留出导航栏的空间
            3.主内容区自然产生滚动条
        ========================================*/

        /* ==========第一步：固定导航栏========== */
        .navbar {
            position: fixed;                 /* 关键：脱离文档流，固定在视口中 */
            top:0;
            left:0;
            right:0;
            height: var(--nav-height);
            z-index:1000;                    /* 确保在最上层 */

            /* 毛玻璃背景 */
            background: rgba(12,15,20,0.72);
            backdrop-filter:blur(20px) saturate(1.6);
            -webkit-backdrop-filter: blur(20px) saturate(1.6);       /* 考虑兼容性 */

            /* 底部分割线 */
            border-bottom:1px solid var(--border);

            /* 导航栏内部用flex水平排列 */
            display: flex;
            align-items: center;
            justify-content: space-between;
            /* 
                上下内边距：0
                左右内边距：clamp(最小值,理想值,最大值)
            */
            padding:0 clamp(16px,4vw,48px);    
            
            /* 滚动时的视觉变化 —— 通过JS切换.scrolled类 */
            transition:box-shadow 0.3 ease, background 0.3s ease;
        }

        .navbar .scrolled {
            background:rgba(12,15,20,0.92);
            box-shadow:0 4px 30px rgba(0,0,0,0.4);
        }

    </style>
</head>
<body>
    <!-- 滚动进度条 -->
    <div></div>

    <!-- 固定导航栏 -->
    <nav></nav>

    <script>
    
    </script>
</body>
</html>
