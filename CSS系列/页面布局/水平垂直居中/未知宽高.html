<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>未知宽高</title>
    <style>
        .outer {
            width: 400px;
            height: 600px;
            border: 1px solid red;
            background-color: green;
            position: relative;
        }

        .inner {
            position: absolute;
            background: gold;
            width: 100px;
            height: 100px;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
        }
    </style>
</head>

<body>
    <div class="outer">
        <div class="inner"></div>
    </div>
</body>

</html>
