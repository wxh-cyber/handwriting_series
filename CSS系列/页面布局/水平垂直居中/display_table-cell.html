<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>display:table-cell</title>
    <style>
        .outer {
            width: 400px;
            height: 600px;
            border: 1px solid red;
            background-color: transparent;
            display: table-cell;
            vertical-align: middle;
        }

        .inner {
            background: blue;
            width: 200px;
            height: 300px;
            border: 1px solid gold;
            margin: 0 auto;
        }
    </style>
</head>

<body>
    <div class="outer">
        <div class="inner">我想居中显示</div>
    </div>
</body>

</html>
