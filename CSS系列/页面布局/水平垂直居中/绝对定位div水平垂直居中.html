<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>绝对定位div水平垂直居中</title>
    <style>
        .outer {
            width: 400px;
            height: 600px;
            border: 1px solid red;
            background-color: pink;
            position: relative;
        }

        .inner {
            position: absolute;
            background: green;
            left: 0;
            right: 0;
            top: 0;
            bottom: 0;
            width: 200px;
            height: 300px;
            margin: auto;
            border: 1px solid blue;
        }
    </style>
</head>

<body>
    <div class="outer">
        <div class="inner"></div>
    </div>
</body>

</html>
