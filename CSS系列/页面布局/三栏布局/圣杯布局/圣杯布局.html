<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>圣杯布局</title>
    <style>
        * {
            padding: 0;
            margin: 0;
        }

        /*给外层容器设置内边距，给左右两栏预留位置*/
        .container {
            padding: 0 200px;
            height: 2000px;
        }

        /*渲染左中右三栏的容器*/
        /*中间一栏设置宽度为100%，撑满整个容器*/
        .middle {
            width: 100%;
            background-color: pink;
            height: 200px;
        }

        .left,
        .right {
            height: 200px;
            width: 200px;
            background-color: red;
        }

        /*给盒子里的所有div一个浮动*/
        .container div {
            float: left;
        }

        /*将左右两栏放到上面两个空栏的位置*/
        .left {
            position: relative;
            left: -200px;
            /*通过左外边距的100%唯一到中间栏的左边*/
            margin-left: -100%;
        }

        .right {
            position: relative;
            left: 200px;
            margin-left: -200px;
        }
    </style>
</head>

<body>
    <div class="container">
        <!-- 
            <div class="left"></div>
            <div class="middle"></div>
            <div class="right"></div> 
            注意：如果写成上面这样的顺序，将不能正常显示左侧区域。

            错误原因：
                1.float: left 后，浏览器先排 left
                    left 初始就在最左侧。
                    这时还没出现 middle，所以它不是“从中间旁边挪位”，而是“自己先占了第一位”。
                2.给 left 加了 margin-left: -100%
                    这个 100% 参考容器内容区宽度。
                    结果是把 left 往左猛拉一个“大宽度”，直接拉出可视区。
                3.再加 left: -200px
                    又继续向左偏移 200px。
                    相当于“已经出界后再出界”，所以左栏更不可能看见。
                4.middle 的 width: 100% 会独占内容区
                    它本身就吃满中间区域。
                    右栏通过 margin-left: -200px + left: 200px 还能被挪进右侧预留位，所以你只看到了“中 + 右”。
        -->
            <div class="middle"></div>
            <div class="left"></div>
            <div class="right"></div>
        <!-- 
            具体实现过程：
                1..container { padding: 0 200px; }
                    左右先预留 200px 槽位，给两侧栏用。
                2.三栏都 float: left
                    进入同一行浮动排版。
                3..middle { width: 100%; }
                    中间栏先占满“内容区”（不含 padding），先把主内容位置定下来。
                4..left { margin-left: -100%; left: -200px; position: relative; }
                    margin-left: -100%：把左栏从中间栏右侧拉回到最左边附近
                    left: -200px：再左移 200，正好进左侧预留 padding 槽
                5..right { margin-left: -200px; left: 200px; position: relative; }
                    margin-left: -200px：把右栏往左拉，贴近中间栏右边
                    left: 200px：再右移 200，正好进右侧预留 padding 槽
        -->
    </div>
</body>

</html>
