<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>float+margin</title>
    <style>
        div {
            height: 500px;
        }

        .left {
            float: left;
            width: 200px;
            height: 200px;
            background: green;
        }

        .right {
            float: right;
            width: 200px;
            height: 200px;
            background: red;
        }

        .middle {
            margin-left: 200px;
            margin-right: 200px;
            background: black;
            height: 200px;
        }
    </style>
</head>

<body>
    <div class="box">
        <div class="left"></div>
        <div class="middle"></div>
        <div class="right"></div>
    </div>
</body>

</html>
