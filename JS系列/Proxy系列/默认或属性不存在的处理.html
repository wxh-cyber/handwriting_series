<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>默认或属性不存在的处理</title>
</head>
<body>
    <script>
        const withDefault=new Proxy({},{
            get(target,key){
                return key in target?target[key]:'default';
            }
        });

        withDefault.foo='bar';             //"bar"
        console.log(withDefault.foo);      //"bar"
        console.log(withDefault.baz);      //"default"
    
    </script>
</body>
</html>
