<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>实现push函数</title>
</head>

<body>
    <script>
        let arr = [];
        Array.prototype.push = function () {
            for (let i = 0; i < arguments.length; i++) {
                this[this.length] = arguments[i];
            }
            return this.length;
        }
    </script>
</body>

</html>
